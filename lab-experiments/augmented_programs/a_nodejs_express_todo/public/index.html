<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Augmented Program (a) — Node.js & Express To-Do List</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 600px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.75rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .todo-form { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .todo-input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .todo-input:focus { outline: none; border-color: #0284c7; }
    .btn {
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      margin-bottom: 0.5rem;
    }
    .todo-item.completed span { text-decoration: line-through; color: #94a3b8; }
    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span class="badge">Augmented Program (a): Node.js & Express REST API</span>
      <h2>Full-Stack To-Do Application</h2>
      <p style="color: #64748b;">Powered by Express server endpoints (GET, POST, PUT, DELETE).</p>
    </div>

    <div class="card">
      <form class="todo-form" id="todoForm">
        <input type="text" id="todoInput" class="todo-input" placeholder="Add task via Express API..." required />
        <button type="submit" class="btn">+ Add via POST</button>
      </form>

      <div id="todoList">
        <p style="text-align: center; color: #94a3b8;">Loading items from /api/todos...</p>
      </div>

      <div style="margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid #f1f5f9; font-size: 0.85rem; color: #64748b; display: flex; justify-content: space-between;">
        <span id="taskCount">0 tasks</span>
        <span>Express HTTP Protocol</span>
      </div>
    </div>
  </div>

  <script>
    const todoList = document.getElementById('todoList');
    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const taskCount = document.getElementById('taskCount');

    // Fetch todos from Express backend (GET /api/todos)
    async function loadTodos() {
      try {
        const res = await fetch('/api/todos');
        const data = await res.json();
        renderTodos(data.data);
      } catch (err) {
        todoList.innerHTML = '<p style="color:red; text-align:center;">Failed to connect to Express API. Ensure server.js is running.</p>';
      }
    }

    function renderTodos(todos) {
      taskCount.textContent = `${todos.length} task(s) total`;
      if (todos.length === 0) {
        todoList.innerHTML = '<p style="text-align: center; color: #94a3b8;">All tasks completed! Add a new one above.</p>';
        return;
      }
      todoList.innerHTML = todos.map(t => `
        <div class="todo-item ${t.completed ? 'completed' : ''}">
          <label style="display: flex; align-items: center; gap: 0.65rem; flex: 1; cursor: pointer;">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo(${t.id}, ${!t.completed})" style="width: 18px; height: 18px;" />
            <span>${t.title}</span>
          </label>
          <button class="delete-btn" onclick="deleteTodo(${t.id})" title="Delete via DELETE endpoint">✕</button>
        </div>
      `).join('');
    }

    // Create todo (POST /api/todos)
    todoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = todoInput.value.trim();
      if (!title) return;

      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });

      todoInput.value = '';
      loadTodos();
    });

    // Toggle todo (PUT /api/todos/:id)
    async function toggleTodo(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      loadTodos();
    }

    // Delete todo (DELETE /api/todos/:id)
    async function deleteTodo(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      loadTodos();
    }

    // Initial load
    loadTodos();
  </script>
</body>
</html>
