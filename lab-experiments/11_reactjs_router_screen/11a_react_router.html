<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 11a — Client-Side Routing with React Router</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 680px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .nav-bar {
      display: flex;
      gap: 0.5rem;
      background: #f8fafc;
      padding: 0.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      border: 1px solid #e2e8f0;
    }
    .nav-btn {
      padding: 0.5rem 1rem;
      border: none;
      background: transparent;
      color: #64748b;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: #0284c7;
      color: white;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Syllabus Experiment 11a:
     * Write a program for routing to different pages using react router.
     * Demonstrates Client-Side Routing (SPA architecture):
     * 1. Navigation state driving route switches without browser reload
     * 2. Page views: /dashboard, /transactions, /budgets
     * 3. Browser History API simulation using window.location hash routing
     */

    const DashboardView = () => (
      <div>
        <h3 style={{ color: '#0284c7', margin: '0 0 0.5rem' }}>📊 Dashboard Overview</h3>
        <p style={{ color: '#64748b' }}>Route: <code>#/dashboard</code></p>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem', marginTop: '1rem' }}>
          <div style={{ background: '#ecfdf5', padding: '1rem', borderRadius: '8px' }}>
            <span style={{ fontSize: '0.8rem', color: '#059669' }}>Total Income</span>
            <div style={{ fontSize: '1.25rem', fontWeight: 'bold', color: '#059669' }}>₹24,500.00</div>
          </div>
          <div style={{ background: '#fef2f2', padding: '1rem', borderRadius: '8px' }}>
            <span style={{ fontSize: '0.8rem', color: '#dc2626' }}>Total Expenses</span>
            <div style={{ fontSize: '1.25rem', fontWeight: 'bold', color: '#dc2626' }}>₹8,900.00</div>
          </div>
        </div>
      </div>
    );

    const TransactionsView = () => (
      <div>
        <h3 style={{ color: '#0284c7', margin: '0 0 0.5rem' }}>💳 Transaction History</h3>
        <p style={{ color: '#64748b' }}>Route: <code>#/transactions</code></p>
        <ul style={{ paddingLeft: '1.2rem', color: '#334155', lineHeight: 1.8 }}>
          <li>Semester Tuition Fee: <strong>-₹15,000</strong></li>
          <li>Campus Internet Pass: <strong>-₹499</strong></li>
          <li>Merit Scholarship: <strong>+₹10,000</strong></li>
        </ul>
      </div>
    );

    const BudgetsView = () => (
      <div>
        <h3 style={{ color: '#0284c7', margin: '0 0 0.5rem' }}>🎯 Monthly Budgets</h3>
        <p style={{ color: '#64748b' }}>Route: <code>#/budgets</code></p>
        <p>Allocated Monthly Cap: <strong>₹12,000.00</strong></p>
        <div style={{ background: '#f1f5f9', borderRadius: '9999px', height: '12px', overflow: 'hidden' }}>
          <div style={{ background: '#0284c7', width: '68%', height: '100%' }}></div>
        </div>
        <p style={{ fontSize: '0.85rem', color: '#64748b', marginTop: '0.5rem' }}>68% consumed (Safe limit)</p>
      </div>
    );

    const App = () => {
      const [currentRoute, setCurrentRoute] = React.useState(window.location.hash || '#/dashboard');

      React.useEffect(() => {
        const handleHashChange = () => {
          setCurrentRoute(window.location.hash || '#/dashboard');
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const navigateTo = (route) => {
        window.location.hash = route;
        setCurrentRoute(route);
      };

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Experiment 11a: React Client-Side Router</span>
            <h2>Client-Side SPA Routing in ReactJS</h2>
            <p style={{ color: '#64748b' }}>Instant view transitions preserving application memory state.</p>
          </div>

          <div className="card">
            {/* Top Navigation Bar */}
            <div className="nav-bar">
              <button 
                className={`nav-btn ${currentRoute === '#/dashboard' ? 'active' : ''}`}
                onClick={() => navigateTo('#/dashboard')}
              >
                Dashboard
              </button>
              <button 
                className={`nav-btn ${currentRoute === '#/transactions' ? 'active' : ''}`}
                onClick={() => navigateTo('#/transactions')}
              >
                Transactions
              </button>
              <button 
                className={`nav-btn ${currentRoute === '#/budgets' ? 'active' : ''}`}
                onClick={() => navigateTo('#/budgets')}
              >
                Budgets
              </button>
            </div>

            {/* Dynamic View Injection based on Route */}
            {currentRoute === '#/dashboard' && <DashboardView />}
            {currentRoute === '#/transactions' && <TransactionsView />}
            {currentRoute === '#/budgets' && <BudgetsView />}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
