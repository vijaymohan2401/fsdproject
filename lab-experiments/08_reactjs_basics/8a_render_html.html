<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 8a — Render HTML to a Web Page using ReactJS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1);
      border: 1px solid #bae6fd;
    }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    h1 { color: #0284c7; margin-top: 0; font-size: 1.6rem; }
    p { line-height: 1.6; color: #475569; }
    .highlight-box {
      background: #f8fafc;
      border-left: 4px solid #0284c7;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 0 8px 8px 0;
    }
    code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>

  <!-- Root mount point for React -->
  <div id="root"></div>

  <script>
    /**
     * Syllabus Experiment 8a:
     * Write a program to render HTML to a web page in ReactJS.
     * Concepts Demonstrated:
     * 1. React.createElement() to construct virtual DOM nodes
     * 2. ReactDOM.createRoot() for React 18 concurrent root rendering
     * 3. Injecting virtual DOM into physical HTML container (#root)
     */

    // Step 1: Create React elements without JSX (raw virtual DOM)
    const badgeElement = React.createElement('span', { className: 'badge' }, 'Experiment 8a: ReactJS Virtual DOM');
    const headingElement = React.createElement('h1', null, 'Rendering HTML with ReactJS');
    const descElement = React.createElement('p', null, 
      'This webpage demonstrates the fundamental mechanism of React rendering HTML elements into the Document Object Model (DOM) using ReactDOM.createRoot().'
    );

    const codeSnippet = React.createElement('div', { className: 'highlight-box' }, [
      React.createElement('strong', { key: 'str' }, 'React 18 Workflow: '),
      React.createElement('p', { key: 'p', style: { margin: '0.5rem 0 0' } }, 
        'ReactDOM.createRoot(document.getElementById("root")).render(element);'
      )
    ]);

    const cardContainer = React.createElement('div', { className: 'card' }, [
      badgeElement,
      headingElement,
      descElement,
      codeSnippet
    ]);

    // Step 2: Render into the real DOM
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(cardContainer);
  </script>
</body>
</html>
