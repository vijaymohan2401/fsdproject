<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 11b — Updating the Screen in ReactJS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 650px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .counter-display {
      font-size: 3rem;
      font-weight: 800;
      color: #0284c7;
      text-align: center;
      margin: 1rem 0;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      margin: 0 0.35rem;
    }
    .btn:hover { background: #0369a1; }
    .render-pill {
      display: inline-block;
      background: #f1f5f9;
      color: #475569;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Syllabus Experiment 11b:
     * Write a program for updating the screen in ReactJS.
     * Demonstrates React Screen Update Lifecycle:
     * 1. Triggering a render: Component state changes via setter function
     * 2. Rendering the component: React executes the component function and calculates Virtual DOM diff
     * 3. Committing to the DOM: ReactDOM applies minimal exact changes to physical browser DOM nodes
     * 4. Automatic Batching: React 18 batches multiple state updates inside event handlers
     */

    const App = () => {
      const [count, setCount] = React.useState(0);
      const [walletBalance, setWalletBalance] = React.useState(5000);
      const renderCount = React.useRef(0);

      // Tracking component evaluation cycles
      renderCount.current += 1;

      const handleBatchIncrement = () => {
        // Automatic batching in React 18: Both state updates trigger only ONE re-render!
        setCount((prev) => prev + 1);
        setWalletBalance((prev) => prev + 250);
      };

      const handleReset = () => {
        setCount(0);
        setWalletBalance(5000);
      };

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Experiment 11b: Screen Updating & Re-rendering</span>
            <h2>How React Updates the Screen</h2>
            <p style={{ color: '#64748b' }}>State mutations schedule virtual DOM diffing and precise UI repaints.</p>
          </div>

          <div className="card" style={{ textAlign: 'center' }}>
            <h3 style={{ margin: 0 }}>Interactive Transaction Counter</h3>
            
            <div className="counter-display">{count}</div>
            
            <p style={{ color: '#64748b', fontSize: '1.1rem' }}>
              Simulated Wallet Balance: <strong style={{ color: '#10b981' }}>₹{walletBalance.toLocaleString('en-IN')}</strong>
            </p>

            <div style={{ marginTop: '1.25rem' }}>
              <button className="btn" onClick={handleBatchIncrement}>
                + Click to Update Screen (+₹250)
              </button>
              <button className="btn" style={{ background: '#64748b' }} onClick={handleReset}>
                Reset
              </button>
            </div>

            <div className="render-pill">
              ⚙️ Component Render Cycle Count: <strong>#{renderCount.current}</strong> (Virtual DOM Diffed)
            </div>
          </div>

          <div className="card">
            <h4>Screen Update Steps Under the Hood:</h4>
            <ol style={{ paddingLeft: '1.2rem', color: '#475569', lineHeight: 1.7 }}>
              <li><strong>Trigger:</strong> User clicks button, dispatching <code>setCount</code> and <code>setWalletBalance</code>.</li>
              <li><strong>Render:</strong> React calls component function to produce new JSX Virtual DOM tree.</li>
              <li><strong>Reconciliation:</strong> React diffs old vs new tree and detects exact text node mutations.</li>
              <li><strong>Commit:</strong> ReactDOM precisely touches only the changed DOM nodes without repainting the entire page.</li>
            </ol>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
