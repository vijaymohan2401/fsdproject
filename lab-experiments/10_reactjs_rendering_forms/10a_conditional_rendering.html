<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 10a — Conditional Rendering in ReactJS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 650px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #0284c7;
      background: #0284c7;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-outline { background: white; color: #0284c7; }
    .alert-box {
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .alert-warning { background: #fffbeb; border: 1px solid #fef3c7; color: #b45309; }
    .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Syllabus Experiment 10a:
     * Write a program for conditional rendering in ReactJS.
     * Demonstrates:
     * 1. Ternary Operator (condition ? <A /> : <B />)
     * 2. Short-circuit Logical AND (condition && <Component />)
     * 3. Early return pattern using standard JavaScript if-else
     * 4. Multi-condition warning status banners (Under Budget, Warning, Exceeded)
     */

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = React.useState(true);
      const [spentAmount, setSpentAmount] = React.useState(4200);
      const budgetLimit = 5000;

      const percent = Math.round((spentAmount / budgetLimit) * 100);

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Experiment 10a: Conditional Rendering</span>
            <h2>Conditional Rendering Techniques in React</h2>
            <p style={{ color: '#64748b' }}>Rendering UI elements dynamically based on reactive conditions.</p>
          </div>

          {/* 1. Ternary Operator: Auth State Toggle */}
          <div className="card">
            <h3 style={{ margin: '0 0 0.5rem' }}>1. Ternary Operator (? :)</h3>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                User Status: <strong>{isLoggedIn ? 'Authenticated Student' : 'Guest / Logged Out'}</strong>
              </div>
              <button className="btn" onClick={() => setIsLoggedIn(!isLoggedIn)}>
                {isLoggedIn ? 'Simulate Log Out' : 'Simulate Sign In'}
              </button>
            </div>
          </div>

          {/* 2. Short-Circuit Logical AND (&&): Conditional Flash Message */}
          <div className="card">
            <h3 style={{ margin: '0 0 0.5rem' }}>2. Logical AND Operator (&&)</h3>
            <p style={{ color: '#64748b', fontSize: '0.9rem' }}>
              Controls whether a special alert notice is displayed when condition evaluates to true:
            </p>
            {isLoggedIn && (
              <div style={{ background: '#e0f2fe', color: '#0369a1', padding: '0.75rem', borderRadius: '6px', borderLeft: '4px solid #0284c7' }}>
                🎉 <strong>Welcome back!</strong> Your authenticated session cookie is validated.
              </div>
            )}
          </div>

          {/* 3. Multi-branch Status Card: Spending Threshold Conditions */}
          <div className="card">
            <h3 style={{ margin: '0 0 0.5rem' }}>3. Multi-branch Financial Alert Badge</h3>
            <p style={{ fontSize: '0.9rem', color: '#64748b' }}>
              Allocated Monthly Budget: <strong>₹{budgetLimit}</strong> | Current Spending: <strong>₹{spentAmount} ({percent}%)</strong>
            </p>

            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}>
              <button className="btn btn-outline" onClick={() => setSpentAmount(2500)}>Set Safe (₹2,500 - 50%)</button>
              <button className="btn btn-outline" onClick={() => setSpentAmount(4200)}>Set 84% Warning</button>
              <button className="btn btn-outline" onClick={() => setSpentAmount(5500)}>Set Over Budget (₹5,500)</button>
            </div>

            {/* Conditional Branching based on thresholds */}
            {percent < 80 ? (
              <div className="alert-box alert-success">
                <span>✅ <strong>Safe Spending:</strong> You have utilized only {percent}% of your monthly allowance.</span>
              </div>
            ) : percent <= 100 ? (
              <div className="alert-box alert-warning">
                <span>⚠️ <strong>80% Threshold Alert:</strong> You have consumed {percent}% of your budget limit!</span>
              </div>
            ) : (
              <div className="alert-box alert-danger">
                <span>🚨 <strong>Budget Exceeded Alert:</strong> Spending has exceeded total budget by ₹{spentAmount - budgetLimit}!</span>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
