<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 10b — Rendering Lists with Keys in ReactJS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 650px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .filter-btn {
      padding: 0.4rem 0.8rem;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-right: 0.5rem;
    }
    .filter-btn.active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      transition: transform 0.15s;
    }
    .list-item:hover {
      transform: translateX(4px);
      border-color: #0284c7;
    }
    .delete-btn {
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fecaca;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Syllabus Experiment 10b:
     * Write a program for rendering lists in ReactJS.
     * Demonstrates:
     * 1. Array.prototype.map() to iterate over collections and generate JSX
     * 2. Crucial importance of the unique "key" prop for React reconciliation algorithm
     * 3. Dynamic array filtering (All / Income / Expense)
     * 4. Dynamic item deletion and empty state fallback message
     */

    const App = () => {
      const initialTransactions = [
        { id: 101, title: 'Freelance Frontend Gig', category: 'Income', amount: 8000, type: 'income' },
        { id: 102, title: 'Wi-Fi Hostel Router Bill', category: 'Bills', amount: 799, type: 'expense' },
        { id: 103, title: 'Data Structures Textbook', category: 'Education', amount: 650, type: 'expense' },
        { id: 104, title: 'College Cafeteria Lunch', category: 'Food', amount: 140, type: 'expense' },
        { id: 105, title: 'Parent Monthly Allowance', category: 'Income', amount: 10000, type: 'income' },
      ];

      const [items, setItems] = React.useState(initialTransactions);
      const [filter, setFilter] = React.useState('all');

      const handleDelete = (id) => {
        setItems(items.filter((item) => item.id !== id));
      };

      const filteredList = items.filter((item) => {
        if (filter === 'income') return item.type === 'income';
        if (filter === 'expense') return item.type === 'expense';
        return true;
      });

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Experiment 10b: Rendering Lists</span>
            <h2>Rendering Dynamic Lists in ReactJS</h2>
            <p style={{ color: '#64748b' }}>Iterating arrays with .map() and utilizing unique keys.</p>
          </div>

          <div className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
              <h3 style={{ margin: 0 }}>Transaction Records ({filteredList.length})</h3>
              <div>
                <button className={`filter-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>All</button>
                <button className={`filter-btn ${filter === 'income' ? 'active' : ''}`} onClick={() => setFilter('income')}>Income</button>
                <button className={`filter-btn ${filter === 'expense' ? 'active' : ''}`} onClick={() => setFilter('expense')}>Expense</button>
              </div>
            </div>

            {/* List Rendering using .map() */}
            {filteredList.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '2rem', color: '#94a3b8' }}>
                No records found matching this category filter.
              </div>
            ) : (
              <div>
                {filteredList.map((item) => (
                  // Crucial: unique "key" prop assigned to the top-level returned JSX node
                  <div key={item.id} className="list-item">
                    <div>
                      <strong style={{ display: 'block' }}>{item.title}</strong>
                      <span style={{ fontSize: '0.8rem', color: '#64748b' }}>Category: {item.category} | Key: #{item.id}</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                      <span style={{ fontWeight: 'bold', color: item.type === 'income' ? '#10b981' : '#ef4444' }}>
                        {item.type === 'income' ? `+₹${item.amount}` : `-₹${item.amount}`}
                      </span>
                      <button className="delete-btn" onClick={() => handleDelete(item.id)}>Remove</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
