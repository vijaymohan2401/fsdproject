<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Augmented Program (b) — ReactJS Quiz Application</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 650px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.85rem 1.15rem;
      margin-bottom: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover {
      border-color: #0284c7;
      background: #f0f9ff;
    }
    .option-btn.selected {
      border-color: #0284c7;
      background: #e0f2fe;
      font-weight: 600;
      color: #0284c7;
    }
    .btn {
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
      margin: 1.5rem 0;
    }
    .progress-fill {
      height: 100%;
      background: #0284c7;
      transition: width 0.3s;
    }
    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #e0f2fe;
      color: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      margin: 1rem auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Augmented Program (b):
     * Design a Quiz app using ReactJS.
     * Features:
     * - Multi-question interactive evaluation
     * - Live score computation & progress bar
     * - Immediate visual feedback on selected options
     * - Final summary performance screen with retake option
     */

    const QUESTIONS = [
      {
        question: "Which React hook is used to perform side-effects such as fetching data or subscribing to events?",
        options: ["useState", "useEffect", "useMemo", "useReducer"],
        answer: 1,
        explanation: "useEffect is specifically intended for side effects, network requests, and DOM subscriptions."
      },
      {
        question: "In ExpressJS, which middleware parses incoming requests with JSON payloads?",
        options: ["express.urlencoded()", "express.static()", "express.json()", "express.router()"],
        answer: 2,
        explanation: "express.json() parses incoming HTTP requests with application/json bodies."
      },
      {
        question: "What MongoDB aggregation pipeline stage is used for filtering documents?",
        options: ["$group", "$match", "$sort", "$project"],
        answer: 1,
        explanation: "$match filters documents matching the specified criteria, similar to find() query predicate."
      },
      {
        question: "In TypeScript, which special type represents a value that will never occur (e.g. an infinite loop or throw)?",
        options: ["any", "unknown", "never", "void"],
        answer: 2,
        explanation: "The 'never' type represents the type of values that never occur, like a function that throws or doesn't return."
      },
      {
        question: "Why must list items in React have a unique 'key' prop?",
        options: [
          "To style list items with CSS",
          "To allow React's reconciliation engine to identify which items have changed or been removed",
          "To sort the list automatically",
          "It is completely optional and ignored"
        ],
        answer: 1,
        explanation: "Keys provide identity to elements in an array so React can reconcile DOM updates efficiently."
      }
    ];

    const QuizApp = () => {
      const [currentIdx, setCurrentIdx] = React.useState(0);
      const [selectedOption, setSelectedOption] = React.useState(null);
      const [score, setScore] = React.useState(0);
      const [isFinished, setIsFinished] = React.useState(false);

      const q = QUESTIONS[currentIdx];
      const progress = ((currentIdx) / QUESTIONS.length) * 100;

      const handleSelect = (idx) => {
        setSelectedOption(idx);
      };

      const handleNext = () => {
        if (selectedOption === q.answer) {
          setScore((s) => s + 1);
        }

        if (currentIdx + 1 < QUESTIONS.length) {
          setCurrentIdx((i) => i + 1);
          setSelectedOption(null);
        } else {
          setIsFinished(true);
        }
      };

      const handleRestart = () => {
        setCurrentIdx(0);
        setSelectedOption(null);
        setScore(0);
        setIsFinished(false);
      };

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Augmented Program (b): ReactJS Quiz App</span>
            <h2>Full Stack Development (FSD-2) Quiz</h2>
            <p style={{ color: '#64748b' }}>Interactive assessment test for Node.js, Express, React, and MongoDB.</p>
          </div>

          <div className="card">
            {!isFinished ? (
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem', color: '#64748b' }}>
                  <span>Question {currentIdx + 1} of {QUESTIONS.length}</span>
                  <span>Score: {score}</span>
                </div>

                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                </div>

                <h3 style={{ margin: '1rem 0 1.25rem', lineHeight: 1.4 }}>{q.question}</h3>

                <div>
                  {q.options.map((opt, idx) => (
                    <button
                      key={idx}
                      className={`option-btn ${selectedOption === idx ? 'selected' : ''}`}
                      onClick={() => handleSelect(idx)}
                    >
                      <strong>{String.fromCharCode(65 + idx)}.</strong> {opt}
                    </button>
                  ))}
                </div>

                <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '1.5rem' }}>
                  <button
                    className="btn"
                    disabled={selectedOption === null}
                    style={{ opacity: selectedOption === null ? 0.5 : 1 }}
                    onClick={handleNext}
                  >
                    {currentIdx + 1 === QUESTIONS.length ? 'Finish Quiz' : 'Next Question →'}
                  </button>
                </div>
              </div>
            ) : (
              <div style={{ textAlign: 'center' }}>
                <h3 style={{ color: '#0284c7' }}>Quiz Completed!</h3>
                <div className="score-circle">
                  {score}/{QUESTIONS.length}
                </div>
                <p style={{ fontSize: '1.1rem', margin: '0.5rem 0 1.5rem' }}>
                  {score >= 4 ? '🎉 Outstanding Performance! Mastered FSD-2 concepts.' : '👍 Good effort! Review syllabus notes and retry.'}
                </p>
                <button className="btn" onClick={handleRestart}>Retake Quiz</button>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<QuizApp />);
  </script>
</body>
</html>
