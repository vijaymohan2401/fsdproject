<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus Experiment 3c: JavaScript To-Do List Application</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .todo-app {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #10b981; margin-top: 0; text-align: center; }
    .input-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
    }
    button {
      background: #10b981;
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #059669; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: #0f172a;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    li.completed span {
      text-decoration: line-through;
      color: #64748b;
    }
    .del-btn {
      background: #ef4444;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="todo-app">
    <h2>Student Tasks To-Do List (Experiment 3c)</h2>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task (e.g. Review FSD-2 Lab)..." />
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = [
      { id: 1, text: 'Submit FSD-2 Laboratory Record', completed: true },
      { id: 2, text: 'Connect SpendWise to MongoDB Atlas', completed: false },
      { id: 3, text: 'Review Express.js Middleware Workflow', completed: false }
    ];

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach(t => {
        const li = document.createElement('li');
        if (t.completed) li.classList.add('completed');

        li.innerHTML = `
          <div style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;" onclick="toggleTask(${t.id})">
            <input type="checkbox" ${t.completed ? 'checked' : ''} />
            <span>${t.text}</span>
          </div>
          <button class="del-btn" onclick="deleteTask(${t.id})">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text, completed: false });
      input.value = '';
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    }

    renderTasks();
  </script>
</body>
</html>
