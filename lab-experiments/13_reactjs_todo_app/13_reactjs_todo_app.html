<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 13 — ReactJS To-Do List Application</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 600px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.75rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
    }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .todo-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .todo-input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .todo-input:focus { outline: none; border-color: #0284c7; }
    .btn {
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.5rem;
    }
    .filter-btn {
      padding: 0.3rem 0.7rem;
      border: none;
      background: none;
      color: #64748b;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    .filter-btn.active { background: #e0f2fe; color: #0284c7; }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }
    .todo-item:hover { border-color: #cbd5e1; }
    .todo-item.completed span {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 0.4rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Syllabus Experiment 13:
     * ReactJS Applications – To-do list and Quiz
     * Task: Design a to-do list application using ReactJS.
     * Features:
     * 1. Add tasks with real-time state mutation
     * 2. Toggle completion status with checkbox
     * 3. Filter views: All, Active, Completed
     * 4. Delete tasks and persistent LocalStorage support
     * 5. Real-time counter of pending tasks
     */

    const TodoApp = () => {
      const [todos, setTodos] = React.useState(() => {
        const saved = localStorage.getItem('fsd_lab_react_todos');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [
          { id: 1, text: 'Pay College Semester Tuition Fee', completed: true },
          { id: 2, text: 'Buy CSE Lab Manual & Note Books', completed: false },
          { id: 3, text: 'Review Monthly Budget for Food & Travel', completed: false },
          { id: 4, text: 'Complete Full Stack Lab Record Experiments', completed: false }
        ];
      });

      const [input, setInput] = React.useState('');
      const [filter, setFilter] = React.useState('all');

      React.useEffect(() => {
        localStorage.setItem('fsd_lab_react_todos', JSON.stringify(todos));
      }, [todos]);

      const handleAdd = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        setTodos([
          { id: Date.now(), text: input.trim(), completed: false },
          ...todos
        ]);
        setInput('');
      };

      const handleToggle = (id) => {
        setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const handleDelete = (id) => {
        setTodos(todos.filter(t => t.id !== id));
      };

      const filteredTodos = todos.filter(t => {
        if (filter === 'active') return !t.completed;
        if (filter === 'completed') return t.completed;
        return true;
      });

      const activeCount = todos.filter(t => !t.completed).length;

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Experiment 13: ReactJS Application</span>
            <h2>Student Task & To-Do List Application</h2>
            <p style={{ color: '#64748b' }}>Complete interactive ReactJS task management application.</p>
          </div>

          <div className="card">
            <form className="todo-form" onSubmit={handleAdd}>
              <input
                type="text"
                className="todo-input"
                placeholder="What needs to be accomplished today?..."
                value={input}
                onChange={(e) => setInput(e.target.value)}
              />
              <button type="submit" className="btn">+ Add Task</button>
            </form>

            <div className="filter-tabs">
              <button className={`filter-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
                All ({todos.length})
              </button>
              <button className={`filter-btn ${filter === 'active' ? 'active' : ''}`} onClick={() => setFilter('active')}>
                Pending ({activeCount})
              </button>
              <button className={`filter-btn ${filter === 'completed' ? 'active' : ''}`} onClick={() => setFilter('completed')}>
                Completed ({todos.length - activeCount})
              </button>
            </div>

            {filteredTodos.length === 0 ? (
              <p style={{ textAlign: 'center', color: '#94a3b8', margin: '2rem 0' }}>No tasks in this view.</p>
            ) : (
              <div>
                {filteredTodos.map(todo => (
                  <div key={todo.id} className={`todo-item ${todo.completed ? 'completed' : ''}`}>
                    <label style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', flex: 1, cursor: 'pointer' }}>
                      <input
                        type="checkbox"
                        checked={todo.completed}
                        onChange={() => handleToggle(todo.id)}
                        style={{ width: '18px', height: '18px' }}
                      />
                      <span>{todo.text}</span>
                    </label>
                    <button className="delete-btn" title="Delete" onClick={() => handleDelete(todo.id)}>✕</button>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '1.25rem', paddingTop: '0.75rem', borderTop: '1px solid #f1f5f9', fontSize: '0.85rem', color: '#64748b' }}>
              <span>{activeCount} active task(s) remaining</span>
              <button style={{ background: 'none', border: 'none', color: '#ef4444', cursor: 'pointer' }} onClick={() => setTodos(todos.filter(t => !t.completed))}>
                Clear Completed
              </button>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TodoApp />);
  </script>
</body>
</html>
