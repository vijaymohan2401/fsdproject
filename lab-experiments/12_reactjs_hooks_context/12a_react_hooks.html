<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 12a — Importance of React Hooks</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f9ff;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 680px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .hook-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .hook-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
    }
    code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Syllabus Experiment 12a:
     * Write a program to understand the importance of using hooks in ReactJS.
     * Demonstrates Core React Hooks:
     * 1. useState: State isolation in functional components
     * 2. useEffect: Managing side-effects (DOM titles, intervals, and cleanup)
     * 3. useRef: Direct DOM manipulation and persistent mutable variables without re-render
     * 4. useMemo: Performance memoization of expensive calculations
     */

    const App = () => {
      // 1. useState Hook
      const [savingsGoal, setSavingsGoal] = React.useState(15000);
      const [currentSavings, setCurrentSavings] = React.useState(9500);

      // 2. useRef Hook
      const inputRef = React.useRef(null);

      // 3. useEffect Hook: Side effect updating document.title and clock
      const [secondsActive, setSecondsActive] = React.useState(0);
      React.useEffect(() => {
        document.title = `Saved: ₹${currentSavings} — React Hooks Lab`;
        const timer = setInterval(() => {
          setSecondsActive((s) => s + 1);
        }, 1000);

        // Cleanup callback executed on unmount
        return () => clearInterval(timer);
      }, [currentSavings]);

      // 4. useMemo Hook: Avoid recomputing expensive progress metrics on unrelated renders
      const progressPercentage = React.useMemo(() => {
        console.log('[useMemo]: Computing savings progress percentage...');
        return Math.min(100, Math.round((currentSavings / savingsGoal) * 100));
      }, [currentSavings, savingsGoal]);

      const handleFocusInput = () => {
        inputRef.current.focus();
        inputRef.current.style.borderColor = '#0284c7';
      };

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Experiment 12a: React Hooks Ecosystem</span>
            <h2>Importance of Using Hooks in ReactJS</h2>
            <p style={{ color: '#64748b' }}>Writing powerful, clean, classless functional components.</p>
          </div>

          <div className="card">
            <h3 style={{ margin: '0 0 1rem', color: '#0284c7' }}>Core Hooks in Action</h3>

            <div className="hook-grid">
              {/* Hook 1: useState & useMemo */}
              <div className="hook-card">
                <h4>1. useState & useMemo</h4>
                <p style={{ fontSize: '0.85rem', color: '#64748b' }}>Target Goal: ₹{savingsGoal} | Current: ₹{currentSavings}</p>
                <div style={{ background: '#e2e8f0', borderRadius: '9999px', height: '10px', overflow: 'hidden', margin: '0.5rem 0' }}>
                  <div style={{ background: '#10b981', width: `${progressPercentage}%`, height: '100%' }}></div>
                </div>
                <strong>{progressPercentage}% Achieved</strong>
                <div style={{ marginTop: '0.5rem' }}>
                  <button className="btn" style={{ padding: '0.3rem 0.6rem', fontSize: '0.8rem' }} onClick={() => setCurrentSavings((s) => s + 1000)}>
                    + Add ₹1,000
                  </button>
                </div>
              </div>

              {/* Hook 2: useEffect & useRef */}
              <div className="hook-card">
                <h4>2. useEffect & useRef</h4>
                <p style={{ fontSize: '0.85rem', color: '#64748b' }}>
                  <code>useEffect</code> active timer: <strong>{secondsActive}s</strong> elapsed.
                </p>
                <input
                  ref={inputRef}
                  type="text"
                  placeholder="useRef DOM input..."
                  style={{ width: '90%', padding: '0.4rem', border: '1px solid #cbd5e1', borderRadius: '4px', marginBottom: '0.5rem' }}
                />
                <button className="btn" style={{ padding: '0.3rem 0.6rem', fontSize: '0.8rem' }} onClick={handleFocusInput}>
                  Focus via useRef
                </button>
              </div>
            </div>
          </div>

          <div className="card">
            <h4>Why Hooks are Essential in Modern React:</h4>
            <ul style={{ paddingLeft: '1.2rem', color: '#475569', lineHeight: 1.7 }}>
              <li><strong>No this keyword confusion:</strong> Eliminates class binding issues and constructor boilerplate.</li>
              <li><strong>Reusable stateful logic:</strong> Custom hooks allow sharing side-effects across components easily.</li>
              <li><strong>Related code grouped together:</strong> <code>useEffect</code> bundles subscription and teardown together instead of splitting across lifecycle methods.</li>
            </ul>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
