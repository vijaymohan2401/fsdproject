<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus 10c — Form Fields and Controlled Components in ReactJS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 680px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      border: 1px solid #bae6fd;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem; }
    .form-control {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .form-control:focus { outline: none; border-color: #0284c7; }
    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .preview-box {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.85rem;
      font-family: monospace;
      color: #334155;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /**
     * Syllabus Experiment 10c:
     * Write a program for working with different form fields using react forms.
     * Demonstrates Controlled Components handling multiple HTML5 input types:
     * 1. Text input (<input type="text" />)
     * 2. Number input (<input type="number" />)
     * 3. Select Dropdown (<select><option /></select>)
     * 4. Radio buttons (<input type="radio" />)
     * 5. Checkbox (<input type="checkbox" />)
     * 6. Multi-line Textarea (<textarea />)
     */

    const App = () => {
      // Single unified state object holding all form field values
      const [formData, setFormData] = React.useState({
        title: '',
        amount: '',
        type: 'expense',
        category: 'Food',
        isRecurring: false,
        notes: '',
      });

      const [submittedRecord, setSubmittedRecord] = React.useState(null);

      // Generic change handler handling multiple form controls
      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData((prev) => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmittedRecord({ ...formData, timestamp: new Date().toLocaleString() });
      };

      return (
        <div className="container">
          <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
            <span className="badge">Experiment 10c: React Forms</span>
            <h2>Multi-Field Controlled React Form</h2>
            <p style={{ color: '#64748b' }}>State synchronization across text, number, select, radio, checkbox & textarea.</p>
          </div>

          <div className="card">
            <form onSubmit={handleSubmit}>
              {/* 1. Text Input */}
              <div className="form-group">
                <label className="form-label">Transaction Title (Text Input):</label>
                <input
                  type="text"
                  name="title"
                  className="form-control"
                  placeholder="e.g. Campus Cafeteria Recharge"
                  value={formData.title}
                  onChange={handleChange}
                  required
                />
              </div>

              {/* 2. Number Input */}
              <div className="form-group">
                <label className="form-label">Amount in INR (Number Input):</label>
                <input
                  type="number"
                  name="amount"
                  className="form-control"
                  placeholder="e.g. 1200"
                  value={formData.amount}
                  onChange={handleChange}
                  required
                />
              </div>

              {/* 3. Radio Buttons */}
              <div className="form-group">
                <label className="form-label">Transaction Nature (Radio Buttons):</label>
                <div style={{ display: 'flex', gap: '1.5rem' }}>
                  <label style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', cursor: 'pointer' }}>
                    <input
                      type="radio"
                      name="type"
                      value="expense"
                      checked={formData.type === 'expense'}
                      onChange={handleChange}
                    />
                    <span>Expense</span>
                  </label>
                  <label style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', cursor: 'pointer' }}>
                    <input
                      type="radio"
                      name="type"
                      value="income"
                      checked={formData.type === 'income'}
                      onChange={handleChange}
                    />
                    <span>Income</span>
                  </label>
                </div>
              </div>

              {/* 4. Select Dropdown */}
              <div className="form-group">
                <label className="form-label">Category (Select Dropdown):</label>
                <select name="category" className="form-control" value={formData.category} onChange={handleChange}>
                  <option value="Food">Food & Dining</option>
                  <option value="Education">Education & Books</option>
                  <option value="Housing">Hostel Rent / Fees</option>
                  <option value="Travel">Transportation</option>
                  <option value="Allowance">Pocket Money / Stipend</option>
                </select>
              </div>

              {/* 5. Checkbox */}
              <div className="form-group">
                <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                  <input
                    type="checkbox"
                    name="isRecurring"
                    checked={formData.isRecurring}
                    onChange={handleChange}
                  />
                  <span>Mark as Recurring Monthly Expense (Checkbox)</span>
                </label>
              </div>

              {/* 6. Textarea */}
              <div className="form-group">
                <label className="form-label">Additional Remarks / Notes (Textarea):</label>
                <textarea
                  name="notes"
                  className="form-control"
                  rows="3"
                  placeholder="Optional details..."
                  value={formData.notes}
                  onChange={handleChange}
                />
              </div>

              <button type="submit" className="btn">Record Form Submission</button>
            </form>
          </div>

          {/* Form State Debug Preview */}
          <div className="card">
            <h4 style={{ margin: '0 0 0.5rem' }}>Live React Form State (JSON):</h4>
            <div className="preview-box">
              {JSON.stringify(formData, null, 2)}
            </div>

            {submittedRecord && (
              <div style={{ marginTop: '1rem', background: '#ecfdf5', padding: '1rem', borderRadius: '8px', border: '1px solid #a7f3d0' }}>
                <strong style={{ color: '#059669' }}>✅ Form Successfully Processed:</strong>
                <p style={{ margin: '0.25rem 0 0', fontSize: '0.9rem' }}>
                  Logged "{submittedRecord.title}" of ₹{submittedRecord.amount} under {submittedRecord.category} at {submittedRecord.timestamp}.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
